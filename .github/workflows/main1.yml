name: runner-test

on:
  workflow_dispatch:      # lets you run it manually from the Actions tab
  push:
    branches: [ main ]    # also runs on every push to main

jobs:
  test:
    runs-on: [self-hosted, azure, vmss]   # <- your VMSS runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner : $(hostname)"
          echo "OS     : $(lsb_release -ds)"
          docker --version
          node -v
          python3 --version
          dotnet --version
          az version --query '"azure-cli"' -o tsv

      - name: Docker test
        run: docker run --rm hello-world
